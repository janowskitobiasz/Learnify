<div class="min-vh-100" style="background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);">
  <div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <button (click)="goBack()" class="btn btn-light shadow-sm" 
              style="border-radius: 0.5rem; border: none;">
        <i class="fas fa-arrow-left me-2"></i>Powrót
      </button>
      <h2 class="h4 mb-0" style="color: #1E293B;">Zaproszenia do klas</h2>
    </div>

    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border" style="color: #4338CA;" role="status">
        <span class="visually-hidden">Ładowanie...</span>
      </div>
      <p class="mt-3 text-secondary">Ładowanie zaproszeń...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 mb-4" 
         style="background: linear-gradient(135deg, #FEE2E2 0%, #FEF2F2 100%); color: #991B1B; border-radius: 0.5rem;">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      {{ error }}
      <button type="button" class="btn-close" (click)="error = null"></button>
    </div>

    <div *ngIf="!isLoading && !error">
      <div *ngIf="invites.length === 0" class="card shadow-sm border-0 p-5 text-center" 
           style="border-radius: 0.75rem; background: white;">
        <p class="text-secondary mb-0">Nie masz żadnych oczekujących zaproszeń.</p>
      </div>

      <div *ngIf="invites.length > 0" class="grid gap-4">
        <div *ngFor="let invite of invites" class="card shadow-sm border-0 mb-3" 
             style="border-radius: 0.75rem; background: white;">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h3 class="h5 mb-2" style="color: #1E293B;">{{ invite.class.class_name }}</h3>
                <p class="text-secondary mb-1">Przedmiot: {{ invite.class.subject }}</p>
                <p class="small text-muted mb-0">Status: {{ getStatusTranslation(invite.status) }}</p>
              </div>
              <div class="d-flex gap-2" *ngIf="invite.status === 'pending'">
                <button (click)="handleInvite(invite, true)" 
                        class="btn btn-primary shadow-sm"
                        [disabled]="isProcessing(invite.id)"
                        style="background: linear-gradient(135deg, #4338CA 0%, #6366F1 100%); border: none; border-radius: 0.5rem;">
                  <span *ngIf="isProcessing(invite.id)" class="spinner-border spinner-border-sm me-2"></span>
                  Akceptuj
                </button>
                <button (click)="handleInvite(invite, false)"
                        class="btn btn-danger shadow-sm"
                        [disabled]="isProcessing(invite.id)"
                        style="background: linear-gradient(135deg, #DC2626 0%, #EF4444 100%); border: none; border-radius: 0.5rem;">
                  <span *ngIf="isProcessing(invite.id)" class="spinner-border spinner-border-sm me-2"></span>
                  Odrzuć
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
